<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Latency Quest</title>
    
    <script src="/assets/scripts/telemetry-sender.js" defer></script>
    
    <script type="module" src="https://unpkg.com/template-for-polyfill@latest/dist/template-for-polyfill.js"></script>

    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; line-height: 1.6; }
        
        /* The Metrics Dashboard Styling (Untouched) */
        #metrics-panel { margin-top: 30px; padding: 20px; border-radius: 8px; background: #f0f0f0; border: 2px solid #ccc; }
        .metric-value { font-size: 1.5em; font-weight: bold; color: #0056b3; }
        .success-mode { border-color: #28a745 !important; background: #e6ffe6 !important; }
        .standard-mode { border-color: #ffc107 !important; background: #fff8e1 !important; }
        
        .hollow-shell { margin-top: 20px; padding: 20px; border: 2px dashed #ccc; border-radius: 8px; text-align: center; color: #777; }
    </style>
</head>
<body>
    <h1>The Target Page</h1>
    <a href="/index.html">⬅ Go Back to Origin</a>

    <div id="metrics-panel">
        <h3>📊 Calculating Load Metrics...</h3>
    </div>

    <div id="heavy-content-container" class="hollow-shell">
        <p>Waiting for activation to load heavy metrics...</p>
    </div>

    <script>
        // --- 1. The Declarative Patch Fetcher ---
        async function fetchDeclarativePatch() {
            const res = await fetch('/api/target-patch.php');
            const htmlPatch = await res.text();
            
            const sandbox = document.createElement('div');
            sandbox.style.display = 'none';
            document.body.appendChild(sandbox);
            
            if (sandbox.setHTML) sandbox.setHTML(htmlPatch);
            else sandbox.innerHTML = htmlPatch;
            
            setTimeout(() => sandbox.remove(), 100);
        }

        // --- 2. The Original Metrics Logic ---
        function displayMetrics() {
            const navEntry = performance.getEntriesByType("navigation")[0];
            const panel = document.getElementById('metrics-panel');
            let displayHTML = "";

            if (navEntry.activationStart > 0) {
                const perceivedLatency = Math.max(0, navEntry.domComplete - navEntry.activationStart);
                panel.classList.add('success-mode');
                displayHTML = `
                    <h3>Speculative Prerender Successful</h3>
                    <p><strong>Perceived Load Time (to User):</strong> <span class="metric-value">${perceivedLatency.toFixed(1)} ms</span></p>
                    <p><small>Chrome background rendering time: ${navEntry.domComplete.toFixed(1)} ms</small></p>
                `;
            } else {
                panel.classList.add('standard-mode');
                displayHTML = `
                    <h3>Standard Network Fetch</h3>
                    <p><strong>Actual Load Time:</strong> <span class="metric-value">${navEntry.domComplete.toFixed(1)} ms</span></p>
                `;
            }
            panel.innerHTML = displayHTML;
        }

        // --- 3. The Grand Central Lifecycle Manager ---
        if (document.prerendering) {
            console.log("1. Background prerendering started. Shell loaded.");
            
            // Wait for the user to actually click!
            document.addEventListener('prerenderingchange', () => {
                console.log("2. Page activated! Firing metrics and fetching heavy data.");
                
                // Show the blazing fast metrics
                setTimeout(displayMetrics, 50); 
                
                // Safely fetch the heavy data now that Chrome won't kill the tab
                fetchDeclarativePatch();
            });
        } else {
            console.log("Standard load detected.");
            window.addEventListener('load', () => {
                setTimeout(displayMetrics, 50);
                fetchDeclarativePatch();
            });
        }
    </script>
</body>
</html>
